name: pages-to-rgb build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/leoalvespak-alt/pages_to_rgb
  ADMIN_IMAGE_NAME: ${{ github.repository }}-admin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install deps
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src/ apps/

      - name: Type check
        run: uv run mypy src/pages_to_audio/ai src/pages_to_audio/llm/providers/gemini_provider.py src/pages_to_audio/ocr/providers/google_document_ai.py apps/api/routers/admin_settings.py apps/api/schemas/admin.py src/pages_to_audio/admin/settings_service.py --ignore-missing-imports --follow-imports=skip --allow-subclassing-any --allow-untyped-decorators --disable-error-code=no-any-return

      - name: Unit tests
        run: uv run pytest tests/unit -q
        env:
          PYTHONPATH: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.pages-rgb
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Extract Admin metadata
        id: admin-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ADMIN_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.admin
          push: true
          tags: ${{ steps.admin-meta.outputs.tags }}
          labels: ${{ steps.admin-meta.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
          platforms: linux/amd64
