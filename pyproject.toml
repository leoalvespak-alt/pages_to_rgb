[project]
name = "pages-to-audio"
version = "0.1.0"
description = "Backend server for Pages to Audio exam processing system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "temporalio>=1.7.0",
    "pillow>=10.4.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "sentry-sdk[fastapi]>=2.14.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "respx>=0.21.0",
    "freezegun>=1.5.0",
    "httpx>=0.27.0",
]
ocr = [
    "google-cloud-documentai>=2.29.0",
    "azure-ai-documentintelligence>=1.0.0",
]
audio = [
    "google-cloud-texttospeech>=2.17.0",
    "azure-cognitiveservices-speech>=1.40.0",
]
rag = [
    "pgvector>=0.3.2",
    "tiktoken>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "temporalio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast tests, no I/O",
    "integration: requires real database",
    "contracts: provider contract tests",
    "workflows: Temporal workflow tests",
    "e2e: end-to-end tests",
    "slow: slow tests (real API calls)",
]
